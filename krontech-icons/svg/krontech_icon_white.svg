<svg width="512" height="512" viewBox="0 0 190 190" xmlns="http://www.w3.org/2000/svg">

  <!-- Anéis orbitais externos -->
  <circle cx="95" cy="95" r="89"
    fill="none" stroke="#E8E8E8" stroke-width="0.9"
    stroke-dasharray="6 9" opacity="0.7"/>

  <circle cx="95" cy="95" r="74"
    fill="none" stroke="#D0D0D0" stroke-width="0.75"
    stroke-dasharray="3 11" opacity="0.45"/>

  <circle cx="95" cy="95" r="60"
    fill="none" stroke="#F0F0F0" stroke-width="0.6"
    stroke-dasharray="2 9" opacity="0.3"/>

  <!-- Círculo principal -->
  <circle cx="95" cy="95" r="44"
    fill="#181818" stroke="#F5F5F5" stroke-width="1.4"/>

  <!-- KT monograma -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- K: vertical -->
    <line x1="76" y1="72" x2="76" y2="118"
      stroke="#FFFFFF" stroke-width="3"/>
    <!-- K: braço superior -->
    <line x1="76" y1="95" x2="93" y2="72"
      stroke="#FFFFFF" stroke-width="3"/>
    <!-- K: braço inferior -->
    <line x1="76" y1="95" x2="95" y2="118"
      stroke="#FFFFFF" stroke-width="3"/>

    <!-- T: barra horizontal -->
    <line x1="103" y1="72" x2="122" y2="72"
      stroke="#E0E0E0" stroke-width="3"/>
    <!-- T: vertical -->
    <line x1="112.5" y1="72" x2="112.5" y2="118"
      stroke="#E0E0E0" stroke-width="3"/>

    <!-- Separador -->
    <line x1="98" y1="78" x2="98" y2="112"
      stroke="#555555" stroke-width="0.9" opacity="0.7"/>

  </g>
</svg>